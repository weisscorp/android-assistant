name: source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bootstrap-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tools -p 'test_prepare_dependencies.py' -q
      - run: python -m json.tool dependencies.json > /dev/null
      - run: python -m json.tool app/src/main/assets/model-catalog.json > /dev/null
